<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notion Style Todo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        }

        body {

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding-top: 60px;

            background: linear-gradient(135deg, #667eea, #764ba2);

            background-size: 400% 400%;

            animation: bgMove 12s ease infinite;

        }

        @keyframes bgMove {

            0% {
                background-position: 0% 50%
            }

            50% {
                background-position: 100% 50%
            }

            100% {
                background-position: 0% 50%
            }

        }

        .container {

            width: 420px;

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(18px);

            border-radius: 20px;

            padding: 25px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);

            border: 1px solid rgba(255, 255, 255, 0.2);

            color: white;

        }

        h1 {

            text-align: center;

            margin-bottom: 20px;

            letter-spacing: 1px;

        }

        form {

            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-bottom: 20px;

        }

        input {

            padding: 10px;

            border: none;

            border-radius: 10px;

            outline: none;

            background: rgba(255, 255, 255, 0.2);

            color: white;

        }

        input::placeholder {

            color: rgba(255, 255, 255, 0.8);

        }

        button {

            padding: 10px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(45deg, #ff512f, #dd2476);

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: .3s;

        }

        button:hover {

            transform: scale(1.05);

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);

        }

        #todos {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }

        .todo {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 10px;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(10px);

            transition: .3s;

        }

        .todo:hover {

            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);

        }

        .todo-left {

            display: flex;

            align-items: center;

            gap: 10px;

        }

        .todo span.done {

            text-decoration: line-through;

            opacity: .6;

        }

        .todo-date {

            font-size: 12px;

            opacity: .8;

        }

        .delete {

            background: none;

            border: none;

            font-size: 20px;

            cursor: pointer;

            color: #ff6b6b;

        }

        .delete:hover {

            transform: scale(1.2);

        }

        .progress-container {

            margin-bottom: 20px;

        }

        .progress-bar {

            height: 8px;

            background: rgba(255, 255, 255, 0.2);

            border-radius: 10px;

            overflow: hidden;

        }

        .progress {

            height: 100%;

            width: 0%;

            background: linear-gradient(90deg, #00f2fe, #4facfe);

            transition: .4s;

        }

        .progress-text {

            font-size: 13px;

            margin-bottom: 5px;

        }
    </style>

</head>

<body>

    <div class="container">

        <h1>My Tasks</h1>

        <div class="progress-container">

            <div class="progress-text" id="progressText">0% completed</div>

            <div class="progress-bar">

                <div class="progress" id="progress"></div>

            </div>

        </div>

        <form id="todoForm">

            <input type="text" id="taskInput" placeholder="Yeni görev..." required>

            <input type="date" id="dateInput">

            <button>Görev Ekle</button>

        </form>

        <div id="todos"></div>

    </div>

    <script>

        let todos = []

        const form = document.getElementById("todoForm")
        const taskInput = document.getElementById("taskInput")
        const dateInput = document.getElementById("dateInput")
        const todosDiv = document.getElementById("todos")

        const progress = document.getElementById("progress")
        const progressText = document.getElementById("progressText")

        loadData()
        render()

        form.addEventListener("submit", function (e) {

            e.preventDefault()

            const todo = {

                title: taskInput.value,
                date: dateInput.value,
                done: false

            }

            todos.push(todo)

            taskInput.value = ""
            dateInput.value = ""

            saveData()
            render()

        })

        function render() {

            todosDiv.innerHTML = ""

            todos.forEach(todo => {

                const div = document.createElement("div")
                div.className = "todo"

                const left = document.createElement("div")
                left.className = "todo-left"

                const checkbox = document.createElement("input")
                checkbox.type = "checkbox"
                checkbox.checked = todo.done

                checkbox.onchange = () => {
                    todo.done = checkbox.checked
                    saveData()
                    render()
                }

                const span = document.createElement("span")
                span.textContent = todo.title

                if (todo.done) span.classList.add("done")

                const date = document.createElement("div")
                date.className = "todo-date"
                date.textContent = todo.date

                left.append(checkbox, span)

                const del = document.createElement("button")
                del.innerHTML = "✕"
                del.className = "delete"

                del.onclick = () => {

                    todos = todos.filter(t => t !== todo)

                    saveData()
                    render()

                }

                div.append(left, date, del)

                todosDiv.append(div)

            })

            updateProgress()

        }

        function updateProgress() {

            if (todos.length === 0) {

                progress.style.width = "0%"
                progressText.textContent = "0% completed"
                return

            }

            const done = todos.filter(t => t.done).length

            const percent = Math.round(done / todos.length * 100)

            progress.style.width = percent + "%"

            progressText.textContent = percent + "% completed"

        }

        function saveData() {

            localStorage.setItem("todos", JSON.stringify(todos))

        }

        function loadData() {

            const data = localStorage.getItem("todos")

            if (data) {

                todos = JSON.parse(data)

            }

        }

    </script>

</body>

</html>
