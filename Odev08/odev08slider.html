<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="odev08style.css">
</head>
<body>
    <h1>Photo Gallery</h1>
    <div class="slider">
        <div class="previous"><i onclick="showPhotos(-1)" class="fa-solid fa-angle-left button"></i></div>
        <div class="photos" id="canvas"><img id="picture" src="img/animal.jpg" alt="photo"></div>
        <div class="next"><i onclick="showPhotos(+1)" class="fa-solid fa-angle-right button"></i></div>
    </div>

    <script src="odev08script.js"></script>
</body>
</html>
