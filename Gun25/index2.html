<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Pro</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(160deg, #4facfe, #00f2fe);
            overflow: hidden;
            color: white;
            transition: 1s;
        }

        /* gece */

        body.night {
            background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
        }

        /* glass card */

        .app {

            width: 360px;

            padding: 30px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(25px);

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4),
                inset 0 0 20px rgba(255, 255, 255, 0.1);

            text-align: center;

            z-index: 5;

        }

        /* search */

        input {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.15);

            color: white;

            outline: none;

            font-size: 16px;

        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        /* button */

        button {

            margin-top: 12px;

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 15px;

            background: linear-gradient(45deg, #ff512f, #dd2476);

            color: white;

            font-weight: bold;

            font-size: 16px;

            cursor: pointer;

        }

        /* info */

        .city {
            font-size: 24px;
            margin-top: 10px;
        }

        .temp {
            font-size: 48px;
            font-weight: bold;
        }

        .desc {
            opacity: .9;
        }

        /* sunrise sunset */

        .suninfo {

            display: flex;

            justify-content: space-between;

            margin-top: 15px;

            font-size: 13px;

            opacity: .9;

        }

        /* rain */

        .rain {

            position: fixed;

            top: -100px;

            width: 2px;

            height: 20px;

            background: white;

            opacity: .6;

            animation: rain linear infinite;

        }

        @keyframes rain {

            from {
                transform: translateY(-100px)
            }

            to {
                transform: translateY(110vh)
            }

        }

        /* snow */

        .snow {

            position: fixed;

            top: -50px;

            animation: snow 8s linear infinite;

        }

        @keyframes snow {

            from {
                transform: translateY(-50px)
            }

            to {
                transform: translateY(110vh)
            }

        }

        /* cloud */

        .cloud {

            position: fixed;

            font-size: 140px;

            opacity: .35;

            animation: cloudMove linear infinite;

        }

        @keyframes cloudMove {

            from {
                transform: translateX(-300px)
            }

            to {
                transform: translateX(120vw)
            }

        }

        /* sun */

        .sun {

            position: fixed;

            top: 8vh;

            right: 8vw;

            width: 140px;

            height: 140px;

            border-radius: 50%;

            background: radial-gradient(circle, #ffd700, #ff8c00);

            box-shadow: 0 0 120px #ffd700;

            animation: pulse 4s infinite alternate;

            z-index: 1;

        }

        @keyframes pulse {

            from {
                transform: scale(1)
            }

            to {
                transform: scale(1.15)
            }

        }

        /* lightning */

        .lightning {

            position: fixed;

            width: 100%;

            height: 100%;

            background: white;

            opacity: 0;

            animation: flash 5s infinite;

            pointer-events: none;

        }

        @keyframes flash {

            0% {
                opacity: 0
            }

            1% {
                opacity: .9
            }

            2% {
                opacity: 0
            }

        }

        /* fog */

        .fog {

            position: fixed;

            width: 200%;

            height: 100%;

            background: rgba(255, 255, 255, 0.15);

            filter: blur(20px);

            animation: fogMove 60s linear infinite;

        }

        @keyframes fogMove {

            from {
                transform: translateX(-50%)
            }

            to {
                transform: translateX(0)
            }

        }

        /* mobile */

        @media (max-width:500px) {

            .sun {
                width: 90px;
                height: 90px;
                top: 5vh;
                right: 5vw;
            }

            .cloud {
                font-size: 100px;
            }

        }

        canvas {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="app">

        <h2>Weather</h2>

        <input id="city" placeholder="Şehir gir">

        <button onclick="getWeather()">Ara</button>

        <div class="city" id="name"></div>

        <div class="temp" id="temp"></div>

        <div class="desc" id="desc"></div>

        <div class="suninfo">

            <div>🌅 <span id="sunrise"></span></div>

            <div>🌇 <span id="sunset"></span></div>

        </div>

        <canvas id="chart"></canvas>

    </div>

    <script>

        const key = "5d10666092f46c556585a37b6a90f8bd"

        function getWeather() {

            let city = document.getElementById("city").value

            fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&lang=tr&appid=${key}`)

                .then(r => r.json())

                .then(data => {

                    showCurrent(data)

                    getForecast(city)

                })

        }

        /* show current */

        function showCurrent(data) {

            document.getElementById("name").innerText = data.name

            document.getElementById("temp").innerText = Math.round(data.main.temp) + "°C"

            document.getElementById("desc").innerText = data.weather[0].description

            let sunrise = new Date(data.sys.sunrise * 1000).toLocaleTimeString("tr", { hour: "2-digit", minute: "2-digit" })

            let sunset = new Date(data.sys.sunset * 1000).toLocaleTimeString("tr", { hour: "2-digit", minute: "2-digit" })

            document.getElementById("sunrise").innerText = sunrise
            document.getElementById("sunset").innerText = sunset

            setEffects(data.weather[0].main, data.dt, data.sys.sunset)

        }

        /* forecast graph */

        function getForecast(city) {

            fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&units=metric&appid=${key}`)

                .then(r => r.json())

                .then(data => {

                    let temps = []
                    let labels = []

                    for (let i = 0; i < 8; i++) {

                        temps.push(data.list[i].main.temp)
                        labels.push(i * 3 + "h")

                    }

                    new Chart(document.getElementById("chart"), {

                        type: "line",

                        data: {
                            labels: labels,
                            datasets: [{
                                data: temps,
                                borderColor: "white",
                                tension: .4
                            }]
                        },

                        options: {
                            plugins: { legend: { display: false } },
                            scales: { y: { display: false }, x: { display: false } }
                        }

                    })

                })

        }

        /* effects */

        function setEffects(type, time, sunset) {

            document.querySelectorAll(".rain,.snow,.cloud,.sun,.lightning,.fog").forEach(e => e.remove())

            if (time > sunset) {
                document.body.classList.add("night")
            } else {
                document.body.classList.remove("night")
            }

            /* rain */

            if (type == "Rain") {

                for (let i = 0; i < 200; i++) {

                    let r = document.createElement("div")

                    r.className = "rain"

                    r.style.left = Math.random() * 100 + "%"

                    r.style.animationDuration = (Math.random() * 0.5 + 0.6) + "s"

                    document.body.appendChild(r)

                }

                /* lightning */

                let l = document.createElement("div")

                l.className = "lightning"

                document.body.appendChild(l)

            }

            /* snow */

            if (type == "Snow") {

                for (let i = 0; i < 120; i++) {

                    let s = document.createElement("div")

                    s.className = "snow"

                    s.innerHTML = "❄"

                    s.style.left = Math.random() * 100 + "%"

                    s.style.fontSize = (Math.random() * 15 + 10) + "px"

                    document.body.appendChild(s)

                }

            }

            /* clouds */

            if (type == "Clouds") {

                for (let i = 0; i < 10; i++) {

                    let c = document.createElement("div")

                    c.className = "cloud"

                    c.innerHTML = "☁"

                    c.style.top = Math.random() * 40 + "vh"

                    c.style.animationDuration = (Math.random() * 40 + 40) + "s"

                    document.body.appendChild(c)

                }

            }

            /* clear */

            if (type == "Clear") {

                let sun = document.createElement("div")

                sun.className = "sun"

                document.body.appendChild(sun)

            }

            /* fog */

            if (type == "Mist") {

                let f = document.createElement("div")

                f.className = "fog"

                document.body.appendChild(f)

            }

        }

        /* auto location */

        navigator.geolocation.getCurrentPosition(pos => {

            let lat = pos.coords.latitude
            let lon = pos.coords.longitude

            fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&lang=tr&appid=${key}`)

                .then(r => r.json())

                .then(data => {

                    showCurrent(data)
                    getForecast(data.name)

                })

        })

    </script>

</body>

</html>
