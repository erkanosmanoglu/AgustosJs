<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather App V2</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(160deg,#2193b0,#6dd5ed);
overflow:hidden;
color:white;
}

/* glass panel */

.panel{

width:380px;

padding:30px;

border-radius:25px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,0.2);

box-shadow:0 20px 60px rgba(0,0,0,0.4);

z-index:10;

}

/* search */

input{

width:100%;

padding:14px;

border:none;

border-radius:15px;

background:rgba(255,255,255,0.15);

color:white;

font-size:16px;

outline:none;

}

/* button */

button{

margin-top:10px;

width:100%;

padding:12px;

border:none;

border-radius:15px;

background:linear-gradient(45deg,#ff512f,#dd2476);

color:white;

font-weight:bold;

}

/* info */

.city{
font-size:26px;
margin-top:10px;
}

.temp{
font-size:48px;
font-weight:bold;
}

.desc{
opacity:.9;
}

/* weather effects */

.rain{

position:fixed;
top:-100px;
width:2px;
height:20px;
background:white;
animation:rain linear infinite;

}

@keyframes rain{

from{transform:translateY(-100px)}
to{transform:translateY(110vh)}

}

.cloud{

position:fixed;
font-size:150px;
opacity:.4;
animation:cloudMove linear infinite;

}

@keyframes cloudMove{

from{transform:translateX(-300px)}
to{transform:translateX(120vw)}

}

.sun{

position:fixed;
top:60px;
right:80px;
width:140px;
height:140px;
border-radius:50%;
background:radial-gradient(circle,#ffd700,#ff8c00);
box-shadow:0 0 120px #ffd700;

}

canvas{
margin-top:15px;
}

</style>
</head>

<body>

<div class="panel">

<h2>Weather V2</h2>

<input id="city" placeholder="Şehir">

<button onclick="getWeather()">Ara</button>

<div class="city" id="name"></div>

<div class="temp" id="temp"></div>

<div class="desc" id="desc"></div>

<canvas id="chart"></canvas>

</div>

<script>

const key="5d10666092f46c556585a37b6a90f8bd"

function getWeather(){

let city=document.getElementById("city").value

fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&lang=tr&appid=${key}`)

.then(r=>r.json())

.then(data=>{

document.getElementById("name").innerText=data.name
document.getElementById("temp").innerText=Math.round(data.main.temp)+"°C"
document.getElementById("desc").innerText=data.weather[0].description

setEffects(data.weather[0].main)

getForecast(city)

})

}

function getForecast(city){

fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&units=metric&appid=${key}`)

.then(r=>r.json())

.then(data=>{

let temps=[]
let labels=[]

for(let i=0;i<8;i++){

temps.push(data.list[i].main.temp)
labels.push(i*3+"h")

}

new Chart(document.getElementById("chart"),{

type:"line",

data:{
labels:labels,
datasets:[{
data:temps,
borderColor:"white",
tension:.4
}]
},

options:{plugins:{legend:{display:false}}}

})

})

}

function setEffects(type){

document.querySelectorAll(".rain,.cloud,.sun").forEach(e=>e.remove())

if(type=="Rain"){

for(let i=0;i<200;i++){

let r=document.createElement("div")

r.className="rain"

r.style.left=Math.random()*100+"%"

r.style.animationDuration=(Math.random()*0.5+0.6)+"s"

document.body.appendChild(r)

}

}

if(type=="Clouds"){

for(let i=0;i<8;i++){

let c=document.createElement("div")

c.className="cloud"

c.innerHTML="☁"

c.style.top=Math.random()*200+"px"

c.style.animationDuration=(Math.random()*40+40)+"s"

document.body.appendChild(c)

}

}

if(type=="Clear"){

let s=document.createElement("div")

s.className="sun"

document.body.appendChild(s)

}

}

</script>

</body>
</html>
